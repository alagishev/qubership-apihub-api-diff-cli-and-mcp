name: Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Configure npm auth
        shell: bash
        env:
          NPMRC: ${{ secrets.NPMRC }}
        run: |
          if [ -n "$NPMRC" ]; then
            printf '%s\n' "$NPMRC" > ~/.npmrc
          fi
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  binary:
    needs: test
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Configure npm auth
        shell: bash
        env:
          NPMRC: ${{ secrets.NPMRC }}
        run: |
          if [ -n "$NPMRC" ]; then
            printf '%s\n' "$NPMRC" > ~/.npmrc
          fi
      - run: npm install
      - run: npm run build:binary
      - uses: actions/upload-artifact@v4
        with:
          name: apihub-api-diff-cli-and-mcp-${{ runner.os }}
          path: dist/apihub-api-diff*
